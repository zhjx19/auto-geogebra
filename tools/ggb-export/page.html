<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GGB Export Driver</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
<div id="ggb-container"></div>
<script>
  window.__ggbReady = false;
  window.__ggbError = null;
  var params = {
    appName: "classic",
    width: 1024,
    height: 768,
    showToolBar: false,
    showAlgebraInput: false,
    showMenuBar: false,
    showResetIcon: false,
    enableLabelDrags: false,
    enableRightClick: false,
    errorDialogsActive: false,
    language: "en",
    appletOnLoad: function () { window.__ggbReady = true; }
  };
  var applet = new GGBApplet(params, true);
  window.addEventListener("load", function () { applet.inject("ggb-container"); });
  window.addEventListener("error", function (e) { window.__ggbError = String(e.message || e); });
</script>
</body>
</html>
