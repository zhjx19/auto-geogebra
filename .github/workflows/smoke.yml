name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke + validators (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 回归冒烟（22 项）
        run: python scripts/smoke_test.py

      - name: L1 语法验证（示例抽样）
        run: python scripts/validate_commands.py examples/demo4-button-secant.txt

      - name: L2 语义验证（示例抽样）
        run: python scripts/validate_types.py examples/demo4-button-secant.txt
